<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 90" role="img" aria-label="Data Sentinel">
<title>Data Sentinel</title>
<style>
  .ink{fill:#0F1F3D}
  .gold{fill:#E0A81C}
  .d{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
  .eject{animation:eject .7s cubic-bezier(.2,.8,.2,1) 1.1s both}
  .ring{fill:none;stroke:#E0A81C;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out 1.9s infinite}
  .wm{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;font-size:36px;font-weight:500;fill:#0F1F3D;animation:fade .6s ease-out 1.2s both}
  .wm tspan{font-weight:400}
  @keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes eject{0%{transform:translate(-13px,8px)}100%{transform:translate(0,0)}}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
  @keyframes fade{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle class="d ink" cx="20" cy="30" r="5.5" style="animation-delay:0s"/>
<circle class="d ink" cx="40" cy="30" r="5.5" style="animation-delay:.08s"/>
<circle class="d ink" cx="20" cy="50" r="5.5" style="animation-delay:.16s"/>
<circle class="d ink" cx="40" cy="50" r="5.5" style="animation-delay:.24s"/>
<circle class="d ink" cx="60" cy="50" r="5.5" style="animation-delay:.32s"/>
<circle class="d ink" cx="20" cy="70" r="5.5" style="animation-delay:.4s"/>
<circle class="d ink" cx="40" cy="70" r="5.5" style="animation-delay:.48s"/>
<circle class="d ink" cx="60" cy="70" r="5.5" style="animation-delay:.56s"/>
<circle class="ring" cx="73" cy="22" r="7"/>
<g class="eject"><circle class="d gold" cx="60" cy="30" r="7" style="animation-delay:.64s"/></g>
<text class="wm" x="100" y="61"><tspan>Data</tspan> Sentinel</text>
</svg>